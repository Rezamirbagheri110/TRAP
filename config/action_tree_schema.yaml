# ============================================================
# Canonical Action Tree Schema  —  v1.3  (2026-05-23)
# status: ACTIVE
#
# Single source of truth for all tree variants.
# Validators, ablation configs, and docs are generated from here.
#
# Fields per node:
#   name        : snake_case identifier (unique across entire tree)
#   description : short human-readable label
#   disabled    : true = node exists but is excluded from action selection
#   children    : list of child nodes (absent on leaf nodes)
#
# Top-level sections:
#   meta            : version, counts, policy
#   attack_tree     : the 12 attack-relevant L1 branches (used in experiments)
#   auxiliary_tree  : 15 non-attack L1 branches (kept for backward-compat / coverage)
#   pruned_leaves   : explicit list of 36 leaf names for Tree-Pruned / Tree-Flat
#   migration_map   : old_name -> new_name for renamed/removed nodes
# ============================================================

meta:
  version: "1.3"
  date: "2026-05-23"
  status: ACTIVE
  authors: ["reza"]
  expected_counts:
    full_active_leaves: 164          # leaves in attack_tree YAML excluding disabled (multimodal=10 disabled)
    full_total_leaves: 174           # all leaves in attack_tree YAML including disabled
    pruned_leaves: 36
    flat_leaves: 36
    attack_l1_count: 12
    max_depth_full: 4        # active full tree is not uniform; deepest path is L1/L2/L3/leaf
    max_depth_pruned: 2
    max_depth_flat: 1
  text_only_policy:
    disabled_categories: [multimodal_attacks]
    reason: "text-only evaluation; image/audio channels not available"

