# ============================================================
# PRUNED LEAVES  (36 leaves — used for Tree-Pruned and Tree-Flat)
# Selection criterion: most distinctive and high-frequency leaf
# per category. Pruned and Flat share identical leaf sets so
# B vs C comparison isolates hierarchy effect only.
# ============================================================
pruned_leaves:
  jailbreak_techniques:
    - base64_encoding
    - research_framing
    - hypothetical_scenario
    - alignment_breaking
    - developer_mode
    - negation_reversal
  roleplay_simulations:
    - immersive_roleplay
    - fictional_story
    - roleplay_scenario          # note: lives here in Pruned, not in jailbreak
    - ttrpg
    - absurdist_humor
    - character_creation
  prompt_injection:              # maps to modern_ai_techniques/prompt_injection subtree
    - system_prompt_leakage
    - instruction_override
    - delimiter_breaking
    - context_poisoning
    - adversarial_suffixes
    - token_smuggling
  social_engineering:
    - expert_impersonation
    - emergency_authority
    - fear_manipulation
    - guilt_manipulation
    - bait_and_switch
    - research_scenarios
  linguistic_semantic:           # maps to linguistic_semantic_attacks subtree
    - euphemism_substitution
    - definition_reframing
    - implicature_exploitation
    - presupposition_injection
    - context_shifting
    - code_switching
  steganography_obfuscation:
    - zero_width_characters
    - homoglyph_substitution
    - invisible_text
    - word_substitution
    - layered_encoding
    - whitespace_encoding         # was leetspeak (which is an encoding_transform, not steg) — replaced to honor no-overlap

# ============================================================
# MIGRATION MAP
# Covers: renames, merges, removals since the original 245-leaf tree.
# Format:
#   old_name:
#     status : renamed | merged | removed
#     new_name: <name>      # for renamed/merged
#     reason  : <why>
# ============================================================
migration_map:

  # --- Renames ---
  # note: 'narrative' branch was split: encoding went to 'encoding_transforms',
  # stories kept as a new 'narrative' branch. The old single 'narrative' branch is gone.
  old_narrative_single_branch:
    status: removed
    reason: >
      Original jailbreak/narrative mixed encoding (base64, code) with stories.
      Split into: encoding_transforms (code+crypto) and narrative (story wrappers).

  educational_obanditsite:
    status: renamed
    new_name: educational_opposite
    reason: Typo/artifact corrected to standard English. Fixed in action_tree.py v1.3.

  presubanditsition_injection:
    status: renamed
    new_name: presupposition_injection
    reason: Typo/artifact corrected. Fixed in action_tree.py v1.3.

  technical_subanditrt:
    status: renamed
    new_name: technical_support
    reason: Typo/artifact corrected. Fixed in action_tree.py v1.3.

  # --- Removals from their original location (node still exists elsewhere) ---
  roleplay_scenario:
    status: moved
    old_path: jailbreak_techniques/narrative/roleplay_scenario
    new_path: roleplay_simulations/roleplay_scenario
    reason: >
      Duplicate — existed both in jailbreak/narrative and roleplay_simulations.
      Removed from jailbreak branch; canonical location is roleplay_simulations (defined
      explicitly in attack_tree as a 4th leaf so it resolves in Full and Pruned alike).

  multi_turn_conversation:
    status: moved
    old_path: modern_ai_techniques/multi_turn_conversation
    new_path: multi_turn_manipulation (L1)
    reason: >
      Multi-turn attacks are an independent mechanism, not a sub-technique of prompt engineering.
      Promoted to L1 and expanded into 3 subtrees: escalation, context_manipulation, conversation_hijacking.

  # --- Removed nodes (deleted entirely) ---
  linguistic_obfuscation:
    status: removed
    reason: >
      Overlapped with linguistic_semantic_attacks. Encoding-only leaves (word_substitution,
      anagram_encoding) absorbed into text_steganography. Semantic leaves (semantic_shifting,
      phonetic_encoding, double_meaning) already present in linguistic_semantic_attacks.

  c_code:
    status: removed
    reason: Redundant with python_code and pseudocode in encoding_transforms; removed in v1.3 restructure.

  reverse_text:
    status: removed
    reason: Marginal distinctiveness; removed from crypto_transform during v1.3 restructure.

  oposite_request:
    status: removed
    reason: Typo duplicate of educational_opposite/negation_reversal; never used in experiments.

  hypothetical_response:
    status: kept
    note: Retained in full tree context branch; not in pruned_leaves.
